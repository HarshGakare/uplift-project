name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"      # match your local Python version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt

      - name: Install packages
        run: pip install -r requirements-api.txt

      - name: Run tests
        run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test                        # only runs if the tests passed
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t uplift-api .

      - name: Start container and check /health
        run: |
          docker run -d --name api -p 8000:8000 uplift-api
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1